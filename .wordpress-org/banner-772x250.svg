<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 250">
  <defs>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3d6c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f15a2b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="772" height="250" fill="url(#bannerGradient)"/>
  
  <!-- Decorative regex patterns in background -->
  <text x="50" y="80" font-family="'Monaco', 'Courier New', monospace" font-size="24" fill="white" opacity="0.15" font-weight="bold">^\w+@\w+\.\w+$</text>
  <text x="50" y="120" font-family="'Monaco', 'Courier New', monospace" font-size="24" fill="white" opacity="0.15" font-weight="bold">[A-Z]{2,}\d{4}</text>
  <text x="50" y="160" font-family="'Monaco', 'Courier New', monospace" font-size="24" fill="white" opacity="0.15" font-weight="bold">^[0-9]{3}-[0-9]{4}$</text>
  <text x="50" y="200" font-family="'Monaco', 'Courier New', monospace" font-size="24" fill="white" opacity="0.15" font-weight="bold">\d{2}/\d{2}/\d{4}</text>
  
  <!-- Main icon and text -->
  <g transform="translate(280, 125)">
    <!-- Icon circle -->
    <circle r="60" fill="white" opacity="0.2"/>
    <text x="0" y="20" font-family="'Monaco', 'Courier New', monospace" font-size="40" font-weight="bold" fill="white" text-anchor="middle">^.+$</text>
  </g>
  
  <!-- Plugin title -->
  <text x="380" y="115" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="start">Regex Validation</text>
  <text x="380" y="150" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="start" opacity="0.9">for Gravity Forms</text>
</svg>

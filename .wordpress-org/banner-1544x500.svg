<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="bannerGradientHD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3d6c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f15a2b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1544" height="500" fill="url(#bannerGradientHD)"/>
  
  <!-- Decorative regex patterns in background -->
  <text x="100" y="160" font-family="'Monaco', 'Courier New', monospace" font-size="48" fill="white" opacity="0.15" font-weight="bold">^\w+@\w+\.\w+$</text>
  <text x="100" y="240" font-family="'Monaco', 'Courier New', monospace" font-size="48" fill="white" opacity="0.15" font-weight="bold">[A-Z]{2,}\d{4}</text>
  <text x="100" y="320" font-family="'Monaco', 'Courier New', monospace" font-size="48" fill="white" opacity="0.15" font-weight="bold">^[0-9]{3}-[0-9]{4}$</text>
  <text x="100" y="400" font-family="'Monaco', 'Courier New', monospace" font-size="48" fill="white" opacity="0.15" font-weight="bold">\d{2}/\d{2}/\d{4}</text>
  
  <!-- Main icon and text -->
  <g transform="translate(560, 250)">
    <!-- Icon circle -->
    <circle r="120" fill="white" opacity="0.2"/>
    <text x="0" y="40" font-family="'Monaco', 'Courier New', monospace" font-size="80" font-weight="bold" fill="white" text-anchor="middle">^.+$</text>
  </g>
  
  <!-- Plugin title -->
  <text x="760" y="230" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="start">Regex Validation</text>
  <text x="760" y="300" font-family="Arial, sans-serif" font-size="44" fill="white" text-anchor="start" opacity="0.9">for Gravity Forms</text>
</svg>
